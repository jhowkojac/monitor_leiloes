services:
  - type: web
    name: monitor-leiloes-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: API_TOKEN
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RATE_LIMIT_CALLS
        value: "50"
      - key: RATE_LIMIT_PERIOD
        value: "60"
